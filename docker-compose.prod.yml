services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        tag: "airsoft-backend"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

  database:
    restart: unless-stopped

  redis:
    restart: unless-stopped
