name: airsoft

services:
  database:
    container_name: airsoft-database
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: "mdpmdpmdp"
      POSTGRES_USER: app
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - database_pgdata:/var/lib/postgresql

  redis:
    container_name: airsoft-redis
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    container_name: airsoft-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_DEBUG: "1"
      APP_ENV: dev
      APP_SECRET: "dev-secret-change-me"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$'
      DATABASE_URL: postgresql://app:mdpmdpmdp@database:5432/app?serverVersion=18&charset=utf8
      REDIS_URL: redis://redis:6379
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_var:/app/var

  frontend:
    container_name: airsoft-frontend
    user: "0:0"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  database_pgdata:
  backend_vendor:
  backend_var:
  frontend_node_modules:
  frontend_next:
