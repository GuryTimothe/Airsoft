name: Lighthouse & Accessibility Audit

on:
  workflow_call:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    name: Lighthouse Performance & Accessibility

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Next.js
        run: cd frontend && npm run build

      - name: Start frontend server
        run: |
          cd frontend
          npm start > /tmp/server.log 2>&1 &
          sleep 3
          # Wait for server to be ready
          for i in {1..60}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "✓ Server is ready on http://localhost:3000"
              break
            fi
            echo "Waiting for server ($i/60)..."
            sleep 1
          done
          # Show server logs
          tail -20 /tmp/server.log || true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: false
          temporaryPublicStorage: true
          configPath: "./frontend/lighthouse.config.js"

      - name: Save Lighthouse Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: ./lhci-results/
          retention-days: 30

      - name: Comment Lighthouse Score
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('./lhci-results/manifest.json', 'utf8'));
            const scores = results[0]?.summary || {};

            const comment = `
            ## 🔍 Lighthouse Audit Results

            | Metric | Score |
            |--------|-------|
            | 🎯 Performance | ${Math.round((scores.performance || 0) * 100)} |
            | ♿ Accessibility | ${Math.round((scores.accessibility || 0) * 100)} |
            | ✨ Best Practices | ${Math.round((scores['best-practices'] || 0) * 100)} |
            | 🔒 SEO | ${Math.round((scores.seo || 0) * 100)} |

            **Requirements:**
            - Performance > 80 ✓
            - Accessibility > 90 ✓
            - Best Practices > 85 ✓

            [📊 Full Report](https://lighthouse-ci.com)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
