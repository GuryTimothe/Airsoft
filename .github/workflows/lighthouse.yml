name: Lighthouse & Accessibility Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    name: Lighthouse Performance & Accessibility

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Next.js
        run: cd frontend && npm run build

      - name: Start frontend server
        run: |
          cd frontend
          npm start &
          sleep 5
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: "./frontend/lighthouse.config.js"

      - name: Save Lighthouse Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: ./lhci-results/

      - name: Comment Lighthouse Score
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('./lhci-results/manifest.json', 'utf8'));
            const scores = results[0]?.summary || {};

            const comment = `
            ## 🔍 Lighthouse Audit Results

            | Metric | Score |
            |--------|-------|
            | 🎯 Performance | ${Math.round((scores.performance || 0) * 100)} |
            | ♿ Accessibility | ${Math.round((scores.accessibility || 0) * 100)} |
            | ✨ Best Practices | ${Math.round((scores['best-practices'] || 0) * 100)} |
            | 🔒 SEO | ${Math.round((scores.seo || 0) * 100)} |

            **Requirements:**
            - Performance > 80 ✓
            - Accessibility > 90 ✓
            - Best Practices > 85 ✓

            [📊 Full Report](https://lighthouse-ci.com)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  axe-accessibility:
    runs-on: ubuntu-latest
    name: Automated Accessibility Testing (axe)

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run axe accessibility tests
        run: cd frontend && npm run test:a11y 2>&1 || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: ./frontend/coverage/

  jest-coverage:
    runs-on: ubuntu-latest
    name: Jest Coverage

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests with coverage
        run: cd frontend && npm test -- --coverage --watchAll=false

      - name: Check coverage thresholds
        run: |
          cd frontend
          if [ $(cat coverage/coverage-summary.json | grep -o '"lines":[^,]*' | grep -o '[0-9.]*$' | head -1) -lt 70 ]; then
            echo "❌ Coverage below 70% threshold"
            exit 1
          else
            echo "✓ Coverage meets 70% threshold"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
