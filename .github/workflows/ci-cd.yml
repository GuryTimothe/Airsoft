name: CI

# CI validates code only. Deployment is handled by Coolify, which builds and
# restarts the stack from its own git webhook; no job here touches production.

on:
  push:
    branches:
      - "**"

jobs:
  frontend:
    uses: ./.github/workflows/frontend-ci.yml
    with:
      node-version: 20
      working-directory: frontend

  backend:
    uses: ./.github/workflows/backend-ci.yml
    with:
      php-version: 8.4
      working-directory: backend

  scanner:
    needs: [frontend, backend]
    uses: ./.github/workflows/security-scanner.yml
