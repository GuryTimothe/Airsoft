name: Deploy

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild without the Docker layer cache"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      force:
        description: "Rebuild without the Docker layer cache"
        required: false
        default: false
        type: boolean
    secrets:
      COOLIFY_URL:
        description: "Coolify instance base URL, e.g. https://coolify.example.com"
        required: true
      COOLIFY_TOKEN:
        description: "Coolify API token with deploy permission"
        required: true
      COOLIFY_RESOURCE_UUID:
        description: "UUID of the Coolify resource to deploy"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  # Never cancel a deploy in flight: Coolify would be left mid-rollout.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
      FORCE_REBUILD: ${{ inputs.force && 'true' || 'false' }}

    steps:
      # Coolify pulls the source itself, so there is nothing to check out or
      # upload. This job only triggers the deploy and reports its outcome.
      - name: Validate configuration
        run: |
          set -euo pipefail
          test -n "${COOLIFY_URL}" || { echo "::error::Missing secret COOLIFY_URL"; exit 1; }
          test -n "${COOLIFY_TOKEN}" || { echo "::error::Missing secret COOLIFY_TOKEN"; exit 1; }
          test -n "${COOLIFY_RESOURCE_UUID}" || { echo "::error::Missing secret COOLIFY_RESOURCE_UUID"; exit 1; }
          case "${COOLIFY_URL}" in
            https://*) ;;
            *) echo "::error::COOLIFY_URL must start with https://"; exit 1 ;;
          esac

      - name: Trigger deployment
        id: trigger
        run: |
          set -euo pipefail
          api="${COOLIFY_URL%/}/api/v1"

          # Status and body are captured separately so a 4xx/5xx can be reported
          # with the server's message instead of dying inside a substitution.
          status="$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            "${api}/deploy?uuid=${COOLIFY_RESOURCE_UUID}&force=${FORCE_REBUILD}")"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify returned HTTP ${status} when queueing the deploy"
            cat response.json || true
            exit 1
          fi

          if ! jq -e '(.deployments // []) | length > 0' response.json >/dev/null; then
            echo "::error::Coolify accepted the request but queued no deployment"
            cat response.json || true
            exit 1
          fi

          deployment_uuid="$(jq -r '.deployments[0].deployment_uuid // empty' response.json)"
          if [ -z "$deployment_uuid" ]; then
            echo "::error::Response contained no deployment_uuid"
            cat response.json || true
            exit 1
          fi

          echo "deployment_uuid=${deployment_uuid}" >> "$GITHUB_OUTPUT"
          echo "Queued deployment ${deployment_uuid}"

      - name: Wait for deployment to finish
        env:
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          api="${COOLIFY_URL%/}/api/v1"
          deadline=$(( SECONDS + 1500 ))
          last_status="unknown"

          while [ "$SECONDS" -lt "$deadline" ]; do
            # A transient poll failure must not fail the deploy, so this request
            # is allowed to error and is retried on the next iteration.
            body="$(curl -sS \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Accept: application/json" \
              "${api}/deployments/${DEPLOYMENT_UUID}" 2>/dev/null || true)"

            status="$(printf '%s' "${body}" | jq -r '.status // empty' 2>/dev/null || true)"
            [ -n "$status" ] && last_status="$status"

            case "$status" in
              finished)
                echo "Deployment ${DEPLOYMENT_UUID} finished."
                exit 0
                ;;
              failed|error)
                echo "::error::Deployment ${DEPLOYMENT_UUID} failed. Check the deployment logs in Coolify."
                exit 1
                ;;
              cancelled|cancelled-by-user)
                echo "::error::Deployment ${DEPLOYMENT_UUID} was cancelled."
                exit 1
                ;;
              "")
                echo "Status unavailable, retrying..."
                ;;
              *)
                echo "Status: ${status}"
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out after 25 minutes waiting for ${DEPLOYMENT_UUID} (last status: ${last_status}). It may still be running in Coolify."
          exit 1
