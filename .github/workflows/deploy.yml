name: Deploy website on push

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on VPS (SSH)
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate required settings
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || (echo "Missing secret VPS_HOST" && exit 1)
          test -n "$VPS_PORT" || (echo "Missing secret VPS_PORT" && exit 1)
          test -n "$VPS_USER" || (echo "Missing secret VPS_USER" && exit 1)
          test -n "$DEPLOY_PATH" || (echo "Missing secret DEPLOY_PATH" && exit 1)

      - name: Setup SSH key authentication
        if: ${{ secrets.VPS_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Install sshpass for password authentication
        if: ${{ secrets.VPS_SSH_PRIVATE_KEY == '' && secrets.VPS_PASSWORD != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Sync project files with rsync (SSH key)
        if: ${{ secrets.VPS_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'backend/vendor/' \
            -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=no" \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Sync project files with rsync (password)
        if: ${{ secrets.VPS_SSH_PRIVATE_KEY == '' && secrets.VPS_PASSWORD != '' }}
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'backend/vendor/' \
            -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=no" \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Run deployment command on VPS (SSH key)
        if: ${{ secrets.VPS_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          REMOTE_COMMAND="${DEPLOY_COMMAND:-cd '$DEPLOY_PATH' && bash start-prod.sh}"
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND"

      - name: Run deployment command on VPS (password)
        if: ${{ secrets.VPS_SSH_PRIVATE_KEY == '' && secrets.VPS_PASSWORD != '' }}
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          REMOTE_COMMAND="${DEPLOY_COMMAND:-cd '$DEPLOY_PATH' && bash start-prod.sh}"
          sshpass -e ssh -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND"

      - name: Fail when no SSH authentication secret is configured
        if: ${{ secrets.VPS_SSH_PRIVATE_KEY == '' && secrets.VPS_PASSWORD == '' }}
        run: |
          echo "Set one authentication method: VPS_SSH_PRIVATE_KEY or VPS_PASSWORD"
          exit 1
