security:
  # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      # Ensure dev tools and static assets are always allowed
      pattern: ^/(_profiler|_wdt|assets|build)/
      security: false

    public_login:
      pattern: ^/api/login
      stateless: true
      provider: app_user_provider

      login_throttling:
        max_attempts: 3
        interval: "5 minutes"

      json_login:
        check_path: /api/login
        username_path: email
        password_path: password
        success_handler: App\Security\Jwt\LoginSuccessHandler
        failure_handler: App\Security\Jwt\GenericAuthenticationFailureHandler

    public_register:
      pattern: ^/api/register
      stateless: true
      security: false

    public_logout:
      pattern: ^/api/logout
      stateless: true
      security: false

    public_csrf_login:
      pattern: ^/api/csrf
      stateless: true
      security: false

    main:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      jwt: ~

      # Activate different ways to authenticate:
      # https://symfony.com/doc/current/security.html#the-firewall

      # https://symfony.com/doc/current/security/impersonating_user.html
      # switch_user: true

  # Note: Only the *first* matching rule is applied
  access_control:
    - { path: ^/api/csrf, roles: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/api/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/api/register, roles: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/api/logout, roles: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/api/games$, roles: PUBLIC_ACCESS, methods: [GET] }
    - { path: ^/api/games/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
  security:
    password_hashers:
      # Password hashers are resource-intensive by design to ensure security.
      # In tests, it's safe to reduce their cost to improve performance.
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4 # Lowest possible value for bcrypt
        time_cost: 3 # Lowest possible value for argon
        memory_cost: 10 # Lowest possible value for argon
