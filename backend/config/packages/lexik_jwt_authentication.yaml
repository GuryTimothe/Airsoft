lexik_jwt_authentication:
  secret_key: "%env(resolve:JWT_SECRET_KEY)%"
  public_key: "%env(resolve:JWT_PUBLIC_KEY)%"
  pass_phrase: "%env(JWT_PASSPHRASE)%"
  # aud/iss are validated in App\Security\Jwt\TokenVersionSubscriber using JWT_AUDIENCE and JWT_ISSUER
  token_extractors:
    authorization_header:
      enabled: true
      prefix: Bearer
      name: Authorization
    cookie:
      enabled: true
      name: ma_access_token
  blocklist_token:
    enabled: true
    cache: lexik_jwt_blocklist.cache
