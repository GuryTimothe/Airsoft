; Production PHP settings. Loaded as zz-app.ini so it wins over the
; defaults shipped by the base image.

; The application code is baked into the image and never changes at runtime,
; so revalidating file timestamps on every request is pure overhead.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; opcache.preload is deliberately left unset. config/preload.php exists and
; would work, but a preload_user that fails to resolve aborts PHP startup, and
; that is not worth a boot failure for a small bootstrap gain. Enable it once a
; build can be verified end to end.

realpath_cache_size = 4096K
realpath_cache_ttl = 600

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
