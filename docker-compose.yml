name: airsoft

services:
  database:
    container_name: airsoft-database
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_pgdata:/var/lib/postgresql

  redis:
    container_name: airsoft-redis
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    container_name: airsoft-backend
    volumes:
      - backend_jwt:/app/config/jwt
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_DEBUG: ${APP_DEBUG}
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DEFAULT_URI: ${DEFAULT_URI}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_INACTIVITY_TIMEOUT: ${JWT_INACTIVITY_TIMEOUT}
      LOGIN_CSRF_TOKEN_TTL: ${LOGIN_CSRF_TOKEN_TTL}
      SUPER_ADMIN_FIRSTNAME: ${SUPER_ADMIN_FIRSTNAME}
      SUPER_ADMIN_LASTNAME: ${SUPER_ADMIN_LASTNAME}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    container_name: airsoft-frontend
    user: "0:0"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL}

volumes:
  database_pgdata:
  backend_vendor:
  backend_var:
  backend_jwt:
  frontend_node_modules:
  frontend_next:
