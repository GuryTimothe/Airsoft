services:
  db:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: symfony
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    command: php -S 0.0.0.0:8000 -t public

  frontend:
    build: ./frontend
    container_name: nextjs
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  db_data:

networks:
  airsoft-network:
    driver: bridge
    external: true
